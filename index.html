<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GADverse Animation | Official Links</title>
  <style>
    :root {
      --bg-dark: #040508;
      --card-bg: #0b0d17;
      
      /* Warna Logo: Gerdy (Cyan), Adam (Red), Sadewa (Purple) */
      --c-gerdy: #00f2fe;
      --c-adam: #ff2052;
      --c-sadewa: #a822ff;
      
      --text-main: #ffffff;
      --text-sub: #8d9bb0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Background Cyber-Grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 34, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -2;
    }

    /* Ambient Tri-Color Ambient Glow */
    .bg-aura {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(130px);
      z-index: -1;
      opacity: 0.35;
      animation: auraPulse 6s ease-in-out infinite alternate;
    }

    .aura-1 { background: var(--c-gerdy); top: -50px; left: -50px; }
    .aura-2 { background: var(--c-adam); bottom: -50px; right: -50px; }
    .aura-3 { background: var(--c-sadewa); top: 40%; left: 50%; transform: translate(-50%, -50%); }

    @keyframes auraPulse {
      0% { opacity: 0.25; transform: scale(0.9); }
      100% { opacity: 0.45; transform: scale(1.1); }
    }

    /* 3D Cyber Console Main Box (Bukan Kartu Pasaran) */
    .cyber-deck {
      width: 100%;
      max-width: 410px;
      background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px 24px 28px;
      text-align: center;
      position: relative;
      
      /* Konstruksi Blok 3D Statis (Tebal Berdimensi) */
      box-shadow: 
        -8px 10px 0px 0px var(--c-sadewa),
        -16px 18px 0px 0px rgba(0, 242, 254, 0.4),
        0 20px 40px rgba(0, 0, 0, 0.9);
      
      animation: deckUnfold 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Hiasan Sudut Cyber/HUD */
    .cyber-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 3px solid transparent;
    }

    .corner-tl { top: 12px; left: 12px; border-top-color: var(--c-gerdy); border-left-color: var(--c-gerdy); }
    .corner-tr { top: 12px; right: 12px; border-top-color: var(--c-sadewa); border-right-color: var(--c-sadewa); }
    .corner-bl { bottom: 12px; left: 12px; border-bottom-color: var(--c-adam); border-left-color: var(--c-adam); }
    .corner-br { bottom: 12px; right: 12px; border-bottom-color: var(--c-gerdy); border-right-color: var(--c-gerdy); }

    /* Frame Logo 3D Layered */
    .logo-3d-frame {
      position: relative;
      width: 115px;
      height: 115px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--c-gerdy), var(--c-adam), var(--c-sadewa));
      box-shadow: 
        0 0 20px rgba(0, 242, 254, 0.4),
        0 0 30px rgba(168, 34, 255, 0.3);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #000;
      border: 3px solid #0b0d17;
    }

    /* Badge Label Anime Studio */
    .studio-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--c-gerdy);
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ffffff, var(--c-gerdy) 50%, var(--c-sadewa));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 0.95rem;
      color: #d1d5db;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* Tombol Mekanis 3D Tactile (Press Button) */
    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 26px;
    }

    .btn-3d {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.12s ease-in-out;
      -webkit-tap-highlight-color: transparent;
    }

    /* 3D Extrusion Bevels per Sosial Media */
    .btn-tiktok {
      background: #0d1527;
      border: 2px solid var(--c-gerdy);
      box-shadow: 0 6px 0 0 var(--c-gerdy), 0 10px 20px rgba(0, 242, 254, 0.2);
    }

    .btn-youtube {
      background: #230d13;
      border: 2px solid var(--c-adam);
      box-shadow: 0 6px 0 0 var(--c-adam), 0 10px 20px rgba(255, 32, 82, 0.2);
    }

    .btn-instagram {
      background: #1d0d29;
      border: 2px solid var(--c-sadewa);
      box-shadow: 0 6px 0 0 var(--c-sadewa), 0 10px 20px rgba(168, 34, 255, 0.2);
    }

    /* Efek Menekan Tombol Fisik (3D Push-Down) */
    .btn-3d:hover {
      transform: translateY(-2px);
    }

    .btn-tiktok:hover { box-shadow: 0 8px 0 0 var(--c-gerdy), 0 0 25px rgba(0, 242, 254, 0.5); }
    .btn-youtube:hover { box-shadow: 0 8px 0 0 var(--c-adam), 0 0 25px rgba(255, 32, 82, 0.5); }
    .btn-instagram:hover { box-shadow: 0 8px 0 0 var(--c-sadewa), 0 0 25px rgba(168, 34, 255, 0.5); }

    /* Sensasi Tekan Sakelar Saat Diklik / Disentuh */
    .btn-3d:active {
      transform: translateY(6px) !important;
      box-shadow: 0 0px 0 0 transparent !important;
    }

    .btn-icon {
      font-size: 1.3rem;
    }

    /* Teks CTA & Footer */
    .cta-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 22px;
      padding: 0 8px;
    }

    footer {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      padding-top: 16px;
    }

    /* Entrance Animation */
    @keyframes deckUnfold {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(30px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Background -->
  <div class="bg-aura aura-1"></div>
  <div class="bg-aura aura-2"></div>
  <div class="bg-aura aura-3"></div>

  <!-- Main Cyber Console -->
  <main class="cyber-deck">
    
    <!-- Corner HUD Accents -->
    <div class="cyber-corner corner-tl"></div>
    <div class="cyber-corner corner-tr"></div>
    <div class="cyber-corner corner-bl"></div>
    <div class="cyber-corner corner-br"></div>

    <!-- Header -->
    <header>
      <div class="logo-3d-frame">
        <img src="logo GAD.png" alt="GADverse Animation Logo" class="logo-img">
      </div>
      <span class="studio-badge">Animation AI Studio</span>
      <h1 class="brand-title">GADverse</h1>
      <p class="tagline">Welcome to the GADverse 🎬✨</p>
    </header>

    <!-- 3D Tactile Buttons -->
    <nav class="links-wrapper">
      <a href="https://www.tiktok.com/@gad.verse.animation" class="btn-3d btn-tiktok" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">🎵</span> TikTok
      </a>
      <a href="https://www.youtube.com/@GADverse_76" class="btn-3d btn-youtube" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">▶️</span> YouTube
      </a>
      <a href="https://www.instagram.com/gad.verse.animation/" class="btn-3d btn-instagram" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">📸</span> Instagram
      </a>
    </nav>

    <!-- CTA Subtext -->
    <p class="cta-text">
      Follow perjalanan GADverse dan jangan sampai ketinggalan animasi terbaru! 🚀
    </p>

    <!-- Footer -->
    <footer>
      © 2026 GADverse Animation — Enter the GADverse 🌌
    </footer>

  </main>

</body>
</html>
